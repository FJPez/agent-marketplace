services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_marketplace
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
