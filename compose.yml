services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_marketplace
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agent_marketplace
      APP_REDIS_URL: redis://redis:6379/0
      APP_JWT_SECRET_KEY: test-secret-key-with-32-bytes-123
      APP_SIWE_DOMAIN: localhost
      PORT: 8000
    ports:
      - "18000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
