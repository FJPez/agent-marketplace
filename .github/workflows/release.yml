name: Release

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Deployment environment to release.
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      smoke_base_url:
        description: Public base URL to smoke test after the deploy step has completed.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy to Railway
        run: |
          railway up \
            --ci \
            --service api
      - name: Release summary
        run: |
          {
            echo "## Railway deploy started"
            echo
            echo "- Environment: ${{ inputs.target_environment }}"
            echo "- Railway service: api"
            echo "- Smoke URL: ${{ inputs.smoke_base_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      SMOKE_BASE_URL: ${{ inputs.smoke_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --locked
      - name: Smoke test deployed service
        run: |
          for _ in $(seq 1 30); do
            if uv run python scripts/deployment_smoke.py; then
              exit 0
            fi
            sleep 20
          done
          echo "Smoke checks did not pass before timeout." >&2
          exit 1
      - name: Smoke summary
        run: |
          {
            echo "## Railway smoke checks passed"
            echo
            echo "- Environment: ${{ inputs.target_environment }}"
            echo "- Smoke URL: ${{ inputs.smoke_base_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
