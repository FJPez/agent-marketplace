[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-marketplace"
version = "0.1.0"
description = "FastAPI backend for an agent marketplace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi[standard]>=0.116.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.11.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.41,<3.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.1,<9.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "ruff>=0.12.12,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "SLOT",
    "T20",
    "TC",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
