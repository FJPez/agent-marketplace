[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-marketplace"
version = "0.1.0"
description = "FastAPI backend for an agent marketplace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "cdp-sdk>=1.40.0",
    "coredis>=5.1.0,<6.0.0",
    "eth-account>=0.13.7,<1.0.0",
    "eth-utils>=5.3.1,<6.0.0",
    "fastapi[standard]>=0.116.0,<1.0.0",
    "jsonschema>=4.25.0,<5.0.0",
    "limits>=5.8.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.11.0,<3.0.0",
    "PyJWT>=2.10.1,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.41,<3.0.0",
    "websockets>=13,<14",
    "x402[evm,fastapi,httpx]",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=8.4.1,<9.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "ruff>=0.12.12,<1.0.0",
    "ty>=0.0.21,<0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ty.src]
include = ["app", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "SLOT",
    "T20",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
